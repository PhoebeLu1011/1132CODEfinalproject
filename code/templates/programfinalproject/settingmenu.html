<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Setting Menu - Life Explosion</title>
        <style>
            body{
                background-color: #F5F5F5;
                font-family: 'Rubik Marker Hatch', sans-serif;
                margin: 0;
                padding: 20px;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
            }

            h2{
                font-size: 28px;
                font-weight: bold;
                margin-bottom: 10px;
                text-shadow: 1px 1px 2px #888888;
                font-weight: bold;
                
            }

            h3{
                font-size: 20px;
                font-weight: normal;
                margin-bottom: 30px;
                color: #333333;
                font-weight: bold;
            }

            .button {
                display: block;
                width: 300px;
                padding: 15px;
                font-size: 18px;
                font-weight: bold;
                border: none;
                border-radius: 30px;
                cursor:pointer;
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
                margin: 15px 0;
                transition: 0.3s;
            }
            .aboutus-button{
                background-color: #4E4E4E;
                color: #FFFFFF;
            }

            .privacy-button{
                background-color: #7A7A7A;
                color: #F5F5F5;
            }

            .desgin-button{
                background-color: #B0B0B0;
                color: #2E2E2E;
            }
            
            .button:hover{
                transform: scale(1.08);
                opacity: 0.9;
            }

        </style>



    </head>

    <body>
        <h3>Life Explosion Simulator:Final Exam Hell Edition</h3>
        <h3>人生爆炸模擬器：大學期末地獄篇</h3>
        <button class="button aboutus-button" onclick="location.href='/aboutus'">About US</button>
        <button class="button privacy-button" onclick="location.href='/privacy'">Privacy Policy</button>
        <button class="button desgin-button" onclick="location.href='/design'">Desgin Details</button>
        <button class="button aboutus-button" onclick="location.href='/'">Back</button>
    </body>
</html>
