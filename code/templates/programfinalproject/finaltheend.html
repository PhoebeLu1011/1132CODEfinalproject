<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Life Explosion Simulator: Final Exam Hell Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- 引入Chart.js -->
  <style>
    body {
      background-color: #f0f0f0;
      font-family: 'Courier New', monospace;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      background-color: white;
      width: 600px;
      margin: 50px auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .subtitle {
      font-size: 14px;
      color: #555;
      margin-bottom: 30px;
    }
    .end-title {
      font-size: 24px;
      font-weight: bold;
      background-color: #aaa;
      color: white;
      padding: 10px 0;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .congrats {
      font-size: 22px;
      margin-bottom: 20px;
    }
    .stat-bar {
      display: flex;
      align-items: center;
      margin: 10px 0;
      justify-content: center;
    }
    .stat-bar span {
      width: 100px;
      text-align: right;
      margin-right: 10px;
      font-weight: bold;
    }
    .progress {
      background-color: #ddd;
      width: 200px;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      margin-right: 10px;
    }
    .fill {
      height: 100%;
    }
    .graph {
      margin-top: 30px;
    }
    .back-button {
      margin-top: 30px;
      padding: 10px 40px;
      border: none;
      border-radius: 20px;
      background-color: #666;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="title">Life Explosion Simulator: Final Exam Hell Edition</div>
  <div class="subtitle">人生爆炸模擬器 · 大學期末地獄篇</div>

  <div class="container">
    <div class="end-title">THE END</div>
    <div class="congrats">
      {% if status == "success" %}
        恭喜你逃脫期末地獄！
      {% else %}
        失敗，再接再厲！
      {% endif %}
    </div>
    <p style="margin-bottom: 30px; font-size: 16px; color: #333;">{{ ending }}</p>
    <p style="margin-bottom: 30px; font-size: 15px; color: #777;">{{ ending2 }}</p>


    <div class="stat-bar">
      <span>課業完成度</span>
      <div class="progress">
        <div id="progress-bar" class="fill" style="width: 0%; background-color: red;"></div>
      </div>
      <span id="progress-text">0%</span>
    </div>

    <div class="stat-bar">
      <span>健康度</span>
      <div class="progress">
        <div id="health-bar" class="fill" style="width: 0%; background-color: green;"></div>
      </div>
      <span id="health-text">0%</span>
    </div>

    <div class="stat-bar">
      <span>精力度</span>
      <div class="progress">
        <div id="energy-bar" class="fill" style="width: 0%; background-color: blue;"></div>
      </div>
      <span id="energy-text">0%</span>
    </div>

    <div class="graph">
      <canvas id="resultChart" width="400" height="200"></canvas>
    </div>

    <button class="back-button" onclick="location.href='/'">BACK</button>
  </div>

  <script>
    window.onload = function () {
      const data = JSON.parse('{{ data | safe }}');

      if (!data) {
        alert('沒有找到上一關的資料！請先完成遊戲再來');
        return;
      }

      // 更新血條
      document.getElementById("progress-bar").style.width = data.progress + "%";
      document.getElementById("progress-text").innerText = data.progress + "%";

      document.getElementById("health-bar").style.width = data.health + "%";
      document.getElementById("health-text").innerText = data.health + "%";

      document.getElementById("energy-bar").style.width = data.energy + "%";
      document.getElementById("energy-text").innerText = data.energy + "%";

      // 畫折線圖
      const ctx = document.getElementById("resultChart").getContext("2d");
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.graphData.labels,
          datasets: [
            {
              label: '課業完成度',
              data: data.graphData.grades,
              borderColor: 'red',
              fill: false
            },
            {
              label: '健康度',
              data: data.graphData.healths,
              borderColor: 'green',
              fill: false
            },
            {
              label: '精力度',
              data: data.graphData.energys,
              borderColor: 'blue',
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'top'
            }
          },
          scales: {
            y: {
              min: 0,
              max: 100
            }
          }
        }
      });
    };
  </script>
</body>
</html>
