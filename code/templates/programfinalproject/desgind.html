<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Desgin Details</title>
        <style>
            body{
                background-color: #F5F5F5;
                font-family: 'Rubik Marker Hatch', sans-serif;
                margin: 0;
                padding: 20px;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
            }
            h1 {
                font-size: 24px;
                color:  #333333;;
            }

            h2 {
                margin-top: 25px;
                font-size: 18px;
            }
            ul{
                list-style-type: none;
                padding-left: 0;
                margin-bottom: 40px;
            }
            ul li{
                margin-bottom: 15px;
                font-size: 16px;
                cursor: pointer;
                font-weight: bold;
            }

            .button {
                display: block;
                width: 300px;
                padding: 15px;
                font-size: 18px;
                font-weight: bold;
                border: none;
                border-radius: 30px;
                cursor:pointer;
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
                margin: 15px 0;
                transition: 0.3s;
            }
            .back-button{
                background-color: #B0B0B0;
                color: #2E2E2E;
            }

            .button:hover{
                transform: scale(1.08);
                opacity: 0.9;
            }

            
        </style>
    </head>
    <body>
        <h1>Desgin Details</h1>
        <ul>
            <li>Some UI elements have been adapted from official design kits:</li>
            <li>• Material 3 Design Kit (Google)</li>
            <li>• Simple Design System (Figma Community)</li>
        </ul>

        <button class="button back-button" onclick="history.back()">Back</button>
    </body>
</html>
